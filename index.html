<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagar Scout Pro - Live Adobe Stock Scout</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:'Inter','Hind Siliguri',sans-serif;background:#0a0a0f;color:#e5e7eb}</style>
</head>
<body class="min-h-screen">
<header class="border-b border-white/10 bg-black/30 backdrop-blur-xl sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<h1 class="text-xl font-black">🚀 Sagar Scout Pro <span class="text-cyan-400">LIVE</span></h1>
<div class="flex gap-3">
<a id="sheetLink" href="https://docs.google.com/spreadsheets/d/1SO3aThXX6cu6vav-WO63WEj5TbyRIjF41FiS2UILuJA" target="_blank" class="px-4 py-2 bg-white text-black rounded-full font-semibold text-sm">Open Sheet</a>
<button onclick="loadData()" class="px-4 py-2 bg-cyan-500 text-black rounded-full font-bold text-sm">Refresh</button>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">
<div id="status" class="mb-6 p-3 rounded-xl bg-yellow-500/10 border border-yellow-500/20 text-yellow-300 text-sm">Loading from Google Sheet...</div>

<!-- Featured -->
<div id="featured" class="hidden mb-8 p-6 rounded-[24px] bg-gradient-to-br from-cyan-500/20 to-blue-600/20 border border-cyan-500/30"></div>

<!-- Search -->
<input id="search" placeholder="Search idea, niche, keyword..." class="w-full mb-6 px-5 py-3 rounded-full bg-white/5 border border-white/10 outline-none focus:border-cyan-400" oninput="renderTable()">

<!-- Table -->
<div class="rounded-[20px] overflow-hidden border border-white/10 bg-white/[0.03]">
<div class="overflow-x-auto">
<table class="w-full text-sm">
<thead class="bg-white/5 text-white/50"><tr><th class="p-4 text-left">Idea</th><th class="p-4">Niche</th><th class="p-4">Volume</th><th class="p-4">Competition</th><th class="p-4">Opportunity</th><th class="p-4">Status</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

<p class="mt-8 text-center text-white/30 text-xs">Data: Real Competition from stock.adobe.io API + AI predicted demand from Groq. Auto-refresh every 60s.</p>
</main>

<script>
const SHEET_ID = '1SO3aThXX6cu6vav-WO63WEj5TbyRIjF41FiS2UILuJA';
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
let allRows = [];

async function loadData(){
  try{
    document.getElementById('status').innerHTML = '⏳ Loading...';
    const res = await fetch(URL);
    const txt = await res.text();
    const json = JSON.parse(txt.substr(47).slice(0,-2));
    const rows = json.table.rows;
    allRows = rows.map(r=>({
      date: r.c[0]?.v || '',
      title: r.c[1]?.v || '',
      idea: r.c[2]?.v || '',
      niche: r.c[3]?.v || '',
      volume: r.c[4]?.v || '',
      competition: r.c[5]?.v || 0,
      opportunity: r.c[6]?.v || '',
      keywords: r.c[7]?.v || '',
      status: r.c[8]?.v || ''
    })).filter(x=>x.idea).reverse();

    if(allRows.length===0) throw new Error('Empty');
    document.getElementById('status').className='mb-6 p-3 rounded-xl bg-green-500/10 border border-green-500/20 text-green-300 text-sm';
    document.getElementById('status').innerHTML = `✅ Live! ${allRows.length} ideas loaded. Last: ${new Date().toLocaleTimeString()}`;
    renderFeatured();
    renderTable();
  }catch(e){
    document.getElementById('status').className='mb-6 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm';
    document.getElementById('status').innerHTML = `❌ Sheet Public করো! Google Sheet > Share > Anyone with link > Viewer. Error: ${e.message}`;
  }
}

function badge(comp){
  const n = parseInt(comp)||99999;
  if(n<1000) return `<span class="px-3 py-1 rounded-full bg-green-400 text-black font-black text-xs">🔥 GOLD ${n}</span>`;
  if(n<5000) return `<span class="px-3 py-1 rounded-full bg-yellow-400 text-black font-bold text-xs">${n}</span>`;
  return `<span class="px-3 py-1 rounded-full bg-red-500 text-white text-xs">${n}</span>`;
}
function oppBadge(v){
  const n=parseInt(v)||0;
  if(n>=80) return `<span class="px-2 py-1 rounded-full bg-cyan-400 text-black font-bold">${n}</span>`;
  if(n>=50) return `<span class="px-2 py-1 rounded-full bg-white/20">${n}</span>`;
  return `<span class="px-2 py-1 rounded-full bg-white/10 text-white/50">${n}</span>`;
}

function renderFeatured(){
  if(!allRows.length) return;
  const f = allRows[0];
  document.getElementById('featured').classList.remove('hidden');
  document.getElementById('featured').innerHTML = `
  <div class="flex justify-between items-start gap-4">
    <div><div class="text-cyan-300 text-xs font-bold tracking-widest mb-2">LATEST HOT IDEA</div>
    <h2 class="text-2xl md:text-3xl font-black leading-tight mb-2">${f.title || f.idea}</h2>
    <p class="text-white/60 mb-4">${f.idea}</p>
    <div class="flex flex-wrap gap-2">${(f.keywords||'').split(',').slice(0,8).map(k=>`<span class="px-2 py-1 rounded-full bg-white/10 text-xs">#${k.trim()}</span>`).join('')}</div></div>
    <div class="text-right">${badge(f.competition)}<div class="mt-2">Opportunity ${oppBadge(f.opportunity)}</div><div class="mt-2 text-xs px-3 py-1 rounded-full ${f.status==='Hot'?'bg-red-500 text-white':'bg-white/10'}">${f.status||'Hot'}</div></div>
  </div>`;
}

function renderTable(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const filtered = allRows.filter(r=> (r.idea+r.niche+r.keywords).toLowerCase().includes(q));
  document.getElementById('tbody').innerHTML = filtered.map(r=>`
    <tr class="border-b border-white/5 hover:bg-white/[0.04]">
      <td class="p-4"><div class="font-semibold">${r.idea}</div><div class="text-xs text-white/40">${r.title}</div></td>
      <td class="p-4 text-center"><span class="px-2 py-1 rounded-full bg-white/10 text-xs">${r.niche}</span></td>
      <td class="p-4 text-center font-mono">${r.volume}</td>
      <td class="p-4 text-center">${badge(r.competition)}</td>
      <td class="p-4 text-center">${oppBadge(r.opportunity)}</td>
      <td class="p-4 text-center"><span class="text-xs ${r.status==='Hot'?'text-red-400 font-bold':''}">${r.status}</span></td>
    </tr>
  `).join('');
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
